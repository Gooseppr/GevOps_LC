<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Minima base styles -->
  <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
  <!-- Site custom styles (nav + design system) -->
  <link rel="stylesheet" href="{{ '/assets/nav.css' | relative_url }}?v=10">

  <!-- Mermaid (diagrams) -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      if (!window.mermaid) return;
      // Convert Jekyll-generated pre > code.language-mermaid → div.mermaid
      document.querySelectorAll('pre > code.language-mermaid').forEach(function (code) {
        var pre = code.parentElement;
        var div = document.createElement('div');
        div.className = 'mermaid';
        div.textContent = code.textContent;
        // Preserve original source for TTS (mermaid will replace innerHTML with SVG)
        div.setAttribute('data-mermaid-source', code.textContent);
        pre.replaceWith(div);
      });
      {% if page.course == "grafana" or page.course == "reseaux-cybersecurite" %}
      // Attendre la police : Mermaid mesure les textes pour dimensionner les nœuds
      mermaid.initialize({
        startOnLoad: false,
        theme: 'base',
        fontFamily: '"Manrope", "Segoe UI", Arial, sans-serif',
        themeVariables: {
          fontFamily: '"Manrope", "Segoe UI", Arial, sans-serif',
          fontSize: '15px',
          primaryColor: '#f1f5f9',
          primaryTextColor: '#1f2937',
          primaryBorderColor: '#94a3b8',
          lineColor: '#475569',
          secondaryColor: '#e2e8f0',
          tertiaryColor: '#f8fafc',
          clusterBkg: '#f8fafc',
          clusterBorder: '#cbd5e1',
          edgeLabelBackground: '#ffffff',
          noteBkgColor: '#fef3c7',
          noteBorderColor: '#d97706',
          noteTextColor: '#78350f'
        },
        flowchart: { useMaxWidth: true },
        sequence: { useMaxWidth: true, wrap: true, mirrorActors: false },
        er: { useMaxWidth: true, fontSize: 14 },
        state: { useMaxWidth: true }
      });
      (document.fonts ? document.fonts.ready : Promise.resolve()).then(function () {
        mermaid.run();
      });
      {% else %}
      mermaid.initialize({
        startOnLoad: true,
        theme: 'default',
        flowchart: { useMaxWidth: true },
        sequence: { useMaxWidth: true }
      });
      {% endif %}
    });
  </script>

  <!-- Prism syntax highlighting (client-side) — supporte AL, DAX, KQL, etc. -->
  <script>window.Prism = window.Prism || {}; window.Prism.manual = true;</script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-core.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      if (!window.Prism) return;
      if (Prism.plugins && Prism.plugins.autoloader) {
        Prism.plugins.autoloader.languages_path =
          'https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/';
      }
      Prism.highlightAll();
    });
  </script>

  <!-- Navigation sidebar -->
  <script>
    window.__SITE_BASEURL = "{{ '' | relative_url }}".replace(/\/$/, '');
  </script>
  <script defer src="{{ '/assets/nav.js' | relative_url }}?v=5"></script>
</head>
